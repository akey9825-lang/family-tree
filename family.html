<script>
  'use strict';
  const form = document.getElementById('unlock');
  const button = document.getElementById('open');
  const field = document.getElementById('code');
  const message = document.getElementById('message');
  const frame = document.getElementById('tree');
  const payload = JSON.parse(document.getElementById('encrypted').textContent);
  function decode(value) {
    const base64 = value.replace(/-/g, '+').replace(/_/g, '/');
    return Uint8Array.from(atob(base64), character => character.charCodeAt(0));
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (button.disabled) return;
    if (!window.crypto?.subtle) {
      message.textContent = 'Откройте сайт по HTTPS в современном браузере.';
      return;
    }
    message.textContent = '';
    button.disabled = true;
    try {
      const code = field.value.trim().normalize('NFC');
      if (code.length < 8 || code.length > 128) throw new Error('Invalid code');
      const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({
        name: 'PBKDF2', salt: decode(payload.salt), iterations: payload.iterations, hash: 'SHA-256'
      }, material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: decode(payload.iv) }, key, decode(payload.data));
      frame.srcdoc = new TextDecoder('utf-8', { fatal: true }).decode(decrypted);
      field.value = '';
      document.getElementById('gate').hidden = true;
      frame.hidden = false;
    } catch {
      message.textContent = 'Код доступа не подошел. Проверьте его и попробуйте снова.';
      field.focus();
      field.select();
    } finally {
      button.disabled = false;
    }
  });
</script>
