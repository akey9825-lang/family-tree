<script>'use strict';

const data = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const people = new Map(data.people.map(person => [person.person_id, person]));
const sources = new Map(data.artifacts.map(source => [source.artifact_id, source]));
const claims = new Map(data.claims.map(claim => [claim.claim_id, claim]));
const branchMap = new Map(data.branches.map(branch => [branch.id, branch]));
const words = {'corroborated':'Подтверждено','strongly-corroborated':'Подтверждено','single-source':'Один источник','hypothesis':'Гипотеза','unresolved':'Связь не установлена','contradicted':'Опровергнуто','excluded':'Исключен','none':'Связь не установлена'};
const relationNames = {'parent-of':'Родитель','spouse-of':'Супруги','sibling-of':'Брат или сестра','godparent-of':'Восприемник'};
const strengths = {'strongly-corroborated':5,'corroborated':4,'single-source':3,'hypothesis':2,'unresolved':1};
const map = $('map'), drawer = $('drawer'), world = $('world');
const cardWidth = 220, cardHeight = 105, pitch = 242;
const positions = new Map(), cards = new Map(), edges = new Map();
const personRelations = new Map(data.people.map(p => [p.person_id, []]));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const state = {x:0,y:0,scale:1,space:false,drag:null,frame:0,selected:null,mode:null,branch:'',suppressClick:false};

function el(tag, className, label) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (label) node.textContent = label;
  return node;
}

function ids(value) {
  return (value || '').split(/[;,]/).map(s => s.trim()).filter(Boolean);
}

for (const rel of data.relationships) {
  personRelations.get(rel.person_a_id).push(rel);
  personRelations.get(rel.person_b_id).push(rel);
}

function statusOf(person) {
  if (person.candidate_status === 'excluded') return 'excluded';
  const related = personRelations.get(person.person_id);
  const incoming = related.filter(rel => rel.relationship_type === 'parent-of' && rel.person_b_id === person.person_id);
  const relevant = incoming.length ? incoming : related;
  const strongest = [...relevant].sort((a,b) =>
    (strengths[b.status] || 0) - (strengths[a.status] || 0) || Number(familyConfirmed(b)) - Number(familyConfirmed(a))
  )[0];
  return strongest || {status: ['hypothesis','candidate'].includes(person.candidate_status) ? 'hypothesis' : 'none'};
}

function familyConfirmed(record) {
  const groups = record.independence_groups || record.supporting_independence_groups || '';
  return record.status === 'single-source' && ids(groups).some(group => group.startsWith('FAMILY-CHAT-'));
}

function statusLabel(record) {
  return familyConfirmed(record) ? 'Подтверждено семьей' : words[record.status] || words.none;
}

function badge(record) {
  const node = el('span','badge',statusLabel(record));
  node.dataset.status = record.status || 'none';
  return node;
}

const avatarSVG = '<svg class="portrait" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="22" fill="#e8eee4"/><circle cx="22" cy="17" r="7" fill="currentColor"/><path d="M8 37c1-9 6-13 14-13s13 4 14 13a21 21 0 0 1-28 0Z" fill="currentColor"/></svg>';
function avatar(person) {
  if (person.photo) {
    const image = el('img','portrait');
    image.alt = 'Портрет';
    image.src = person.photo;
    image.addEventListener('error', () => image.replaceWith(avatar({})), {once:true});
    return image;
  }
  const template = el('template');
  template.innerHTML = avatarSVG;
  return template.content.firstElementChild;
}

function life(person) {
  const firstYear = value => (value || '').match(/\b(?:1[5-9]\d{2}|20\d{2})\b/)?.[0];
  const birth = firstYear(person.birth_estimate);
  const death = firstYear(person.death_estimate);
  const approximate = /около|окно|ориент|предпол|оценк/i.test(person.birth_estimate || '');
  const birthLabel = birth ? (approximate ? 'ок. ' : '') + birth : '';
  return birth || death ? (birthLabel || '?') + ' – ' + (death || '?') : 'Годы жизни неизвестны';
}

function place(person) {
  return person.places ? person.places.split(';')[0].trim() : 'Место неизвестно';
}

function annotation(text, x, y, style, accent) {
  const node = el('div',style,text);
  node.style.left = x + 'px';
  node.style.top = y + 'px';
  if (accent) node.style.setProperty('--accent',accent);
  $('labels').append(node);
}

function addCard(person, x, y) {
  const button = el('button','card');
  button.type = 'button';
  button.dataset.person = person.person_id;
  const status = statusOf(person);
  button.dataset.status = status.status;
  button.setAttribute('aria-label',person.preferred_label + ', ' + life(person) + ', ' + statusLabel(status));
  button.style.left = x + 'px';
  button.style.top = y + 'px';
  button.style.setProperty('--accent', branchMap.get(person.branch).color);
  button.append(avatar(person), el('span','name',person.preferred_label), el('span','date',life(person)), el('span','place',place(person)), badge(status));
  button.querySelector('.place').title = person.places || place(person);
  button.addEventListener('click', () => { if (!state.suppressClick && !state.space) openPerson(person.person_id); });
  cards.set(person.person_id,button);
  positions.set(person.person_id,{x,y});
  $('nodes').append(button);
}

function draw() {
  const family = data.people.filter(p => Number.isInteger(p.generation));
  const candidates = data.people.filter(p => !Number.isInteger(p.generation));
  const levels = [...new Set(family.map(p => p.generation))].sort((a,b) => a-b);
  const rows = levels.map(level => {
    const groups = data.branches.map(b => [b,family.filter(p => p.generation === level && p.branch === b.id)]);
    return {level, groups:groups.filter(([,members]) => members.length)};
  });
  const rowWidth = groups => groups.reduce((total,[,members]) => total + members.length * pitch + 24, 0);
  const maxWidth = Math.max(500, ...rows.map(row => rowWidth(row.groups)));
  for (const [index,row] of rows.entries()) {
    const y = 64 + index * 158;
    let x = 118 + (maxWidth - rowWidth(row.groups)) / 2;
    annotation('Поколение ' + (index + 1), 4, y + 46, 'rowtag');
    for (const [branch,members] of row.groups) {
      annotation(branch.label,x,y - 38,'band',branch.color);
      for (const member of members) {
        addCard(member,x,y);
        x += pitch;
      }
      x += 24;
    }
  }
  if (candidates.length) {
    const x = 118 + maxWidth + 75;
    annotation('Кандидаты и однофамильцы',x,26,'band','#b59b6a');
    candidates.forEach((p,i) => addCard(p,x,64 + i * 121));
  }
  for (const rel of data.relationships) {
    const from = positions.get(rel.person_a_id), to = positions.get(rel.person_b_id);
    if (!from || !to) continue;
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const same = from.y === to.y;
    if (same) {
      const a = from.x + cardWidth/2, b = to.x + cardWidth/2, y = from.y;
      path.setAttribute('d','M '+a+' '+y+' C '+a+' '+(y-25)+' '+b+' '+(y-25)+' '+b+' '+y);
    } else {
      const direction = from.y < to.y ? 1 : -1;
      const ax = from.x + cardWidth/2, bx = to.x + cardWidth/2;
      const ay = from.y + (direction > 0 ? cardHeight : 0), by = to.y + (direction > 0 ? 0 : cardHeight);
      const middle = (ay + by)/2;
      path.setAttribute('d','M '+ax+' '+ay+' C '+ax+' '+middle+' '+bx+' '+middle+' '+bx+' '+by);
    }
    path.classList.add('edge');
    if (rel.relationship_type !== 'parent-of') path.classList.add('secondary');
    path.dataset.status = rel.status;
    path.dataset.relationship = rel.relationship_id;
    edges.set(rel.relationship_id,path);
    $('edges').append(path);
  }
}

function applyTransform() {
  world.style.transform = 'translate(' + state.x + 'px,' + state.y + 'px) scale(' + state.scale + ')';
  $('zoom').textContent = Math.round(state.scale * 100) + '%';
}
function animateTo(x,y,scale,animate=true) {
  cancelAnimationFrame(state.frame);
  const start = {x:state.x,y:state.y,scale:state.scale};
  const started = performance.now();
  const duration = animate && !reduceMotion.matches ? 320 : 0;
  const tick = time => {
    const fraction = duration ? Math.min(1,(time-started)/duration) : 1;
    const eased = 1 - Math.pow(1-fraction,3);
    state.x = start.x + (x-start.x)*eased;
    state.y = start.y + (y-start.y)*eased;
    state.scale = start.scale + (scale-start.scale)*eased;
    applyTransform();
    if (fraction < 1) state.frame = requestAnimationFrame(tick);
  };
  if (duration) state.frame = requestAnimationFrame(tick); else tick(started);
}
function availableWidth() {
  return drawer.hidden || map.clientWidth < 740 ? map.clientWidth : map.clientWidth - drawer.offsetWidth;
}
function fit(animate=true) {
  const selectedPositions = [...positions].filter(([id]) => !state.branch || people.get(id).branch === state.branch).map(([,point]) => point);
  const points = selectedPositions.length ? selectedPositions : [...positions.values()];
  const x1 = Math.min(0,...points.map(p => p.x)), x2 = Math.max(...points.map(p => p.x + cardWidth));
  const y1 = Math.min(0,...points.map(p => p.y - 40)), y2 = Math.max(...points.map(p => p.y + cardHeight));
  const width = availableWidth(), height = map.clientHeight;
  const scale = Math.min(1,(width - 34)/(x2-x1),(height-87)/(y2-y1));
  const safeScale = Math.max(.08,scale);
  animateTo((width-(x1+x2)*safeScale)/2,(height-(y1+y2)*safeScale)/2 + 12,safeScale,animate);
}
function centerPerson(id) {
  const position = positions.get(id);
  const scale = Math.max(.82,Math.min(state.scale,1.25));
  animateTo(availableWidth()/2 - (position.x + cardWidth/2)*scale,map.clientHeight/2 - (position.y + cardHeight/2)*scale,scale);
}
function zoomAt(scale,x,y) {
  const newScale = Math.max(.08,Math.min(3.5,scale));
  animateTo(x-(x-state.x)*newScale/state.scale,y-(y-state.y)*newScale/state.scale,newScale,false);
}

function familyPath(id, mode) {
  const visited = new Set([id]), activeEdges = new Set(), queue = [id];
  if (mode === 'branch') {
    const branch = people.get(id).branch;
    for (const p of people.values()) if (p.branch === branch) visited.add(p.person_id);
    for (const r of data.relationships) if (visited.has(r.person_a_id) && visited.has(r.person_b_id)) activeEdges.add(r.relationship_id);
    return {visited,activeEdges};
  }
  for (let i=0;i<queue.length;i++) {
    for (const r of personRelations.get(queue[i])) {
      if (r.relationship_type !== 'parent-of' || r.status === 'contradicted') continue;
      const start = mode === 'ancestors' ? r.person_b_id : r.person_a_id;
      const end = mode === 'ancestors' ? r.person_a_id : r.person_b_id;
      if (start !== queue[i]) continue;
      activeEdges.add(r.relationship_id);
      if (!visited.has(end)) { visited.add(end); queue.push(end); }
    }
  }
  return {visited,activeEdges};
}

function updateHighlight() {
  const focus = state.selected && state.mode ? familyPath(state.selected,state.mode) : null;
  for (const [id,card] of cards) {
    const match = !state.branch || people.get(id).branch === state.branch;
    card.classList.toggle('chosen',state.selected === id);
    card.classList.toggle('dim',(!match && !(focus && focus.visited.has(id))) || Boolean(focus && !focus.visited.has(id)));
  }
  for (const r of data.relationships) {
    const path = edges.get(r.relationship_id);
    if (!path) continue;
    const active = Boolean(focus && focus.activeEdges.has(r.relationship_id));
    const outside = state.branch && (people.get(r.person_a_id).branch !== state.branch || people.get(r.person_b_id).branch !== state.branch);
    path.classList.toggle('active',active);
    path.classList.toggle('dim',!active && Boolean(focus || outside));
  }
  for (const button of $('dossier').querySelectorAll('[data-mode]')) button.setAttribute('aria-pressed',String(Boolean(button.dataset.mode && button.dataset.mode === state.mode)));
}

function section(parent,title) {
  const node = el('section','section');
  node.append(el('h3','',title));
  parent.append(node);
  return node;
}
function reference(url,label) {
  const link = el('a','',label);
  link.href = url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  return link;
}
function sourceJump(id) {
  const button = el('button','relation',id);
  button.type = 'button';
  button.addEventListener('click',() => {
    const source = $('source-' + id);
    if (source) { source.open = true; source.scrollIntoView({block:'nearest',behavior:reduceMotion.matches?'auto':'smooth'}); source.querySelector('summary').focus({preventScroll:true}); }
  });
  return button;
}
function appendRefs(parent, refs) {
  if (!refs.length) return;
  const links = el('div','source-links');
  refs.forEach(id => { if (sources.has(id)) links.append(sourceJump(id)); });
  parent.append(links);
}
function openPerson(id, move=false) {
  const person = people.get(id);
  if (!person) return;
  state.selected = id;
  state.mode = null;
  drawer.hidden = false;
  drawer.scrollTop = 0;
  const panel = $('dossier');
  panel.replaceChildren();
  const profile = el('div','profile'), desc = el('div');
  const h = el('h2','',person.preferred_label);
  h.id = 'person-title';
  desc.append(h,el('p','sub',life(person)),el('p','sub',place(person)),badge(statusOf(person)));
  profile.append(avatar(person),desc);
  panel.append(profile);
  const buttons = el('div','tools');
  for (const [mode,label] of [['ancestors','Показать предков'],['descendants','Показать потомков'],['branch','Показать всю ветку'],['','Сбросить фильтр']]) {
    const button = el('button','',label);
    button.type = 'button';
    button.dataset.mode = mode;
    button.addEventListener('click', () => {
      state.mode = mode || null;
      if (!mode) { state.branch = ''; $('branch').value = ''; }
      updateHighlight();
    });
    buttons.append(button);
  }
  panel.append(buttons);
  const bio = section(panel,'Биографическая справка'), fields = el('dl');
  for (const [key,label] of Object.entries({names_as_written:'Имя в источниках',normalized_name_variants:'Варианты имени',birth_estimate:'Рождение',death_estimate:'Смерть',places:'Места',historical_jurisdictions:'Историческая юрисдикция',relatives_as_reported:'Родственники по источникам',occupation_or_status:'Служба и сословие',confession_or_community_as_recorded:'Вероисповедание',notes:'Сведения и оговорки',merge_or_split_rationale:'Сопоставление личности'})) {
    if (person[key]) fields.append(el('dt','',label),el('dd','',person[key]));
  }
  bio.append(fields);
  const related = personRelations.get(id);
  const cf = new Set(related.flatMap(r=>ids(r.claim_ids)));
  const facts = [...claims.values()].filter(claim => ids(claim.subject_person_ids).includes(id) || cf.has(claim.claim_id));
  const sourceIds = new Set([...ids(person.source_artifact_ids),...data.artifacts.filter(a=>ids(a.person_ids).includes(id)).map(a=>a.artifact_id)]);
  related.forEach(r => [...ids(r.supporting_artifact_ids),...ids(r.contradicting_artifact_ids)].forEach(a=>sourceIds.add(a)));
  facts.forEach(f => [...ids(f.artifact_ids),...ids(f.contradicting_artifact_ids)].forEach(a=>sourceIds.add(a)));
  const connections = section(panel,'Связи'), list = el('ul');
  for (const r of related) {
    const otherId = r.person_a_id === id ? r.person_b_id : r.person_a_id;
    const type = r.relationship_type === 'parent-of' && r.person_a_id === id ? 'Ребенок' : relationNames[r.relationship_type] || r.relationship_type;
    const item = el('li');
    const button = el('button','relation',people.get(otherId).preferred_label);
    button.type = 'button';
    button.addEventListener('click',() => openPerson(otherId,true));
    item.append(el('span','',type + ' · '),button,el('p','',r.rationale),badge(r));
    appendRefs(item,[...ids(r.supporting_artifact_ids),...ids(r.contradicting_artifact_ids)]);
    list.append(item);
  }
  connections.append(related.length ? list : el('p','sub','В реестре нет привязанных связей.'));
  const findings = section(panel,'Факты и гипотезы'), factList = el('ol');
  for (const f of facts) {
    const item = el('li','',f.claim_text);
    item.append(el('p','sub',f.rationale),badge(f));
    appendRefs(item,[...ids(f.artifact_ids),...ids(f.contradicting_artifact_ids)]);
    if (f.next_action) item.append(el('p','sub',f.next_action));
    factList.append(item);
  }
  findings.append(facts.length ? factList : el('p','sub','Отдельных утверждений в реестре пока нет.'));
  const materials = section(panel,'Архивные источники');
  for (const aId of sourceIds) {
    const a = sources.get(aId);
    if (!a) continue;
    const item = el('details');
    item.id = 'source-' + aId;
    item.append(el('summary','',aId + ' · ' + a.source_title));
    const locator = [a.repository_or_archive,a.archival_reference,a.record_date].filter(Boolean).join(' · ');
    if (locator) item.append(el('p','sub',locator));
    if (a.summary) item.append(el('p','',a.summary));
    if (a.reliability_notes) item.append(el('p','sub',a.reliability_notes));
    const links = el('div','source-links');
    if (a.external) links.append(reference(a.external,'Открыть источник'));
    if (a.local) links.append(reference(a.local,a.localKind));
    if (links.childNodes.length) item.append(links);
    materials.append(item);
  }
  if (!sourceIds.size) materials.append(el('p','sub','Источники появятся после проверки документов.'));
  updateHighlight();
  if (move) centerPerson(id);
  $('close').focus({preventScroll:true});
}

function closeDrawer() {
  if (drawer.hidden) return;
  drawer.hidden = true;
  cards.get(state.selected)?.focus({preventScroll:true});
}

function normalized(value) {
  return (value || '').toLocaleLowerCase('ru').replaceAll('ё','е').replaceAll('і','и').replaceAll('ѣ','е').replace(/ъ\b/g,'').trim();
}
function showResults() {
  const query = normalized($('query').value);
  const results = $('results');
  results.replaceChildren();
  results.hidden = !query;
  $('query').setAttribute('aria-expanded',String(!!query));
  if (!query) return;
  const tokens = query.split(/\s+/);
  const matches = [...people.values()].filter(p => {
    const index = normalized([p.preferred_label,p.names_as_written,p.normalized_name_variants,p.places,p.historical_jurisdictions].join(' '));
    return tokens.every(t=>index.includes(t));
  });
  for (const p of matches) {
    const button = el('button','',p.preferred_label);
    button.type = 'button';
    button.append(el('small','',place(p)));
    button.addEventListener('click',() => {
      if (state.branch && state.branch !== p.branch) { state.branch = ''; $('branch').value = ''; }
      results.hidden = true;
      $('query').setAttribute('aria-expanded','false');
      $('query').value = p.preferred_label;
      openPerson(p.person_id,true);
    });
    results.append(button);
  }
  if (!matches.length) results.append(el('div','empty','Совпадений нет'));
}

function hideResults() { $('results').hidden=true; $('query').setAttribute('aria-expanded','false'); }

map.addEventListener('wheel',e => {
  e.preventDefault();
  const rect = map.getBoundingClientRect();
  const factor = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 200 : 1;
  zoomAt(state.scale * Math.exp(-e.deltaY * factor * .0015),e.clientX-rect.left,e.clientY-rect.top);
},{passive:false});
window.addEventListener('keydown',e => {
  if (e.key === 'Escape') { if (!$('results').hidden) hideResults(); else closeDrawer(); }
  if (e.code !== 'Space' || e.target.closest?.('input,select,textarea,[contenteditable],.toolbar,#drawer,.zoom')) return;
  e.preventDefault();
  state.space = true;
  map.classList.add('grab');
});
function releaseSpace() { state.space = false; map.classList.remove('grab'); }
window.addEventListener('keyup',e => { if (e.code === 'Space') releaseSpace(); });
window.addEventListener('blur',releaseSpace);
map.addEventListener('pointerdown',e => {
  if (state.drag || (e.button !== 0 && e.button !== 1) || e.target.closest('.zoom,.key,.hint')) return;
  if (!state.space && e.button !== 1 && e.target.closest('.card')) return;
  cancelAnimationFrame(state.frame);
  state.drag = {id:e.pointerId,x:e.clientX,y:e.clientY,fromX:state.x,fromY:state.y};
  map.classList.add('drag');
  map.setPointerCapture(e.pointerId);
  e.preventDefault();
});
map.addEventListener('pointermove',e => {
  const drag = state.drag;
  if (!drag || drag.id !== e.pointerId) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.hypot(dx,dy)>3) state.suppressClick = true;
  state.x = drag.fromX + dx;
  state.y = drag.fromY + dy;
  applyTransform();
});
function endDrag(e) {
  if (!state.drag || state.drag.id !== e.pointerId) return;
  state.drag = null;
  map.classList.remove('drag');
  setTimeout(() => { state.suppressClick = false; },0);
}
for (const event of ['pointerup','pointercancel','lostpointercapture']) map.addEventListener(event,endDrag);

$('query').addEventListener('input',showResults);
$('query').addEventListener('focus',showResults);
$('query').addEventListener('keydown',e => {
  if (e.key === 'Enter' && !$('results').hidden) { e.preventDefault(); $('results').querySelector('button')?.click(); }
  if (e.key === 'ArrowDown' && !$('results').hidden) { e.preventDefault(); $('results').querySelector('button')?.focus(); }
});
document.addEventListener('pointerdown',e => { if (!e.target.closest('.search')) hideResults(); });
$('branch').addEventListener('change',e => { state.branch = e.target.value; state.mode = null; updateHighlight(); fit(); });
$('fit').addEventListener('click',() => { state.branch = ''; $('branch').value = ''; state.mode = null; updateHighlight(); fit(); });
$('minus').addEventListener('click',() => zoomAt(state.scale/1.25,availableWidth()/2,map.clientHeight/2));
$('plus').addEventListener('click',() => zoomAt(state.scale*1.25,availableWidth()/2,map.clientHeight/2));
$('close').addEventListener('click',closeDrawer);
for (const branch of data.branches) {
  const option = el('option','',branch.label);
  option.value = branch.id;
  $('branch').append(option);
}
$('edition').textContent = data.edition;
$('counts').textContent = data.people.length + ' персон · ' + data.relationships.length + ' связей';
draw();
fit(false);
</script>
</body>
</html>
