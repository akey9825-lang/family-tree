<script>
  'use strict';
  const form = document.getElementById('unlock');
  const button = document.getElementById('open');
  const field = document.getElementById('code');
  const message = document.getElementById('message');
  const frame = document.getElementById('tree');
  const payload = JSON.parse(document.getElementById('encrypted').textContent);
  function decode(value) {
    const base64 = value.replace(/-/g, '+').replace(/_/g, '/');
    return Uint8Array.from(atob(base64), character => character.charCodeAt(0));
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (button.disabled) return;
    if (!window.crypto?.subtle) {
      message.textContent = 'Откройте сайт по HTTPS в современном браузере.';
      return;
    }
    message.textContent = '';
    button.disabled = true;
    try {
      const code = field.value.trim();
      if (!/^[A-Za-z0-9_-]{22}$/.test(code)) throw new Error('Invalid code');
      const key = await crypto.subtle.importKey('raw', decode(code), 'AES-GCM', false, ['decrypt']);
      const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: decode(payload.iv) }, key, decode(payload.data));
      frame.srcdoc = new TextDecoder('utf-8', { fatal: true }).decode(decrypted);
      field.value = '';
      document.getElementById('gate').hidden = true;
      frame.hidden = false;
    } catch {
      message.textContent = 'Код доступа не подошел. Проверьте его и попробуйте снова.';
      field.focus();
      field.select();
    } finally {
      button.disabled = false;
    }
  });
</script>
